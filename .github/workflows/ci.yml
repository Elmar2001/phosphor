name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      # tauri-build refuses to compile when a configured externalBin or
      # resource glob is missing. The real PM3 sidecar and DLLs are GPL
      # artifacts that aren't committed, so stand in empty files.
      - name: Stub Windows PM3 sidecar and DLLs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries src-tauri/pm3-libs/platforms
          touch src-tauri/binaries/proxmark3-x86_64-pc-windows-msvc.exe
          touch src-tauri/pm3-libs/ci-stub.dll src-tauri/pm3-libs/platforms/ci-stub.dll

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Type check and frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
